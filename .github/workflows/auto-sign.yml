name: Auto Sign

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 00:37 自动签到（GitHub cron 使用 UTC，+8 小时）
    - cron: '37 16 * * *'

permissions:
  contents: read

jobs:
  auto-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          patchright install --with-deps chromium
          patchright install chrome || echo "chrome 安装失败，将回退自带 chromium"
          command -v xvfb-run >/dev/null 2>&1 || sudo apt-get install -y xvfb

      - name: Run auto sign
        env:
          YAMIBO_COOKIE: ${{ secrets.YAMIBO_COOKIE }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SC3_UID: ${{ secrets.SC3_UID }}
          EXIT_WHEN_FAIL: ${{ vars.EXIT_WHEN_FAIL }}
          HEADLESS: '0'
        run: |
          # GitHub 定时任务常延迟数小时，可能撞上百合会每日维护（退出码 3）：每 10 分钟重试一次
          for i in $(seq 1 10); do
            code=0
            xvfb-run -a -s "-screen 0 1920x1080x24" python sign.py || code=$?
            if [ "$code" -ne 3 ]; then
              exit "$code"
            fi
            if [ "$i" -lt 10 ]; then
              echo "站点维护中，10 分钟后重试（$i/10）"
              sleep 600
            fi
          done
          echo "维护窗口过长，本次未能签到"
          exit 3
